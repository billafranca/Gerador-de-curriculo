<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerarrículo</title>
    <link rel="icon" type="image/x-icon" href="../page_entrada/images/gera.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap');

:root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --text-main: #0f172a;
    --surface: rgba(255, 255, 255, 0.76);
    --shadow: 0 35px 80px rgba(15, 23, 42, 0.12);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #eef2ff 0%, #f8fafc 45%, #e2e8f0 100%);
    color: var(--text-main);
    line-height: 1.6;
}

main {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
}

nav {
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    background: rgba(255, 255, 255, 0.82);
    border-bottom: 1px solid rgba(15, 23, 42, 0.08);
}

.nav-inner {
    max-width: 1180px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1rem 1.5rem;
}

nav .logo img {
    width: 38px;
    height: auto;
}

nav ul {
    display: flex;
    align-items: center;
    gap: 1.75rem;
    list-style: none;
}

nav a {
    color: var(--text-main);
    text-decoration: none;
    font-weight: 600;
    font-size: 0.98rem;
    transition: color 0.2s ease;
}

nav a:hover {
    color: var(--primary);
}

.hero {
    flex: 1;
    display: grid;
    place-items: center;
    padding: 4rem 1rem;
}

.hero-card {
    width: min(100%, 880px);
    padding: 3rem 2.5rem;
    display: grid;
    place-items: center;
    gap: 1.75rem;
    text-align: center;
    background: var(--surface);
    border-radius: 32px;
    box-shadow: var(--shadow);
    border: 1px solid rgba(99, 102, 241, 0.08);
}

#paOne {
    font-size: clamp(2.2rem, 5vw, 3.6rem);
    font-weight: 800;
    line-height: 1.02;
    color: #0f172a;
    max-width: 12ch;
    white-space: nowrap;
    overflow: hidden;
    border-right: 3px solid var(--primary);
    display: inline-block;
    animation: typing 3.5s steps(30, end), blink 0.8s step-end infinite;
}

#botaoCadastro {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 0.95rem 2.2rem;
    border-radius: 999px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    box-shadow: 0 18px 40px rgba(99, 102, 241, 0.18);
}

#botaoCadastro:hover {
    background: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: 0 24px 48px rgba(99, 102, 241, 0.22);
}

footer {
    padding: 2rem 1rem;
    background: rgba(255, 255, 255, 0.82);
    backdrop-filter: blur(14px);
    border-top: 1px solid rgba(15, 23, 42, 0.08);
}

.links-container {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1rem;
}

.github-link {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    padding: 0.85rem 1.1rem;
    border-radius: 999px;
    background: #f8fafc;
    color: #334155;
    text-decoration: none;
    font-weight: 600;
    transition: transform 0.2s ease, background 0.2s ease, color 0.2s ease;
}

.github-link:hover {
    background: var(--primary);
    color: #fff;
    transform: translateY(-2px);
}

.github-link img {
    width: 18px;
    opacity: 0.9;
}

@keyframes typing {
    from {
        width: 0;
    }
    to {
        width: 100%;
    }
}

@keyframes blink {
    50% {
        border-color: transparent;
    }
}

@media (max-width: 860px) {
    .nav-inner {
        flex-direction: column;
        align-items: flex-start;
        padding: 1rem;
        gap: 0.75rem;
    }

    nav ul {
        flex-wrap: wrap;
        justify-content: center;
        width: 100%;
        gap: 1rem;
    }

    #paOne {
        color: lightblue;
        max-width: none;
        white-space: normal;
        border-right: none;
    }

    .hero-card {
        padding: 2rem 1.5rem;
    }
}

@media (max-width: 520px) {
    .nav-inner {
        align-items: center;
    }

    nav ul {
        justify-content: center;
    }

    #botaoCadastro {
        width: 100%;
        max-width: 320px;
    }

    .hero {
        padding: 3rem 0.75rem;
    }
}
</style>

<body>
    <main>
        <header>
            <nav>
                <div class="nav-inner">
                    <div class="logo">
                        <img src="images/icon_white.png" alt="Logo">
                    </div>
                    <ul>
                        <li><a id="home" href="#">Home</a></li>
                        <li><a id="sobre" href="#">Sobre</a></li>
                        <li><a id="contato" href="https://github.com/billafranca">Contato</a></li>
                        <li><a id="gerar" href="../page_gerador/gerador.html">Gerar sem cadastro</a></li>
                    </ul>
                </div>
            </nav>
        </header>
        <section class="hero">
            <div class="hero-card">
                <p id="paOne">Gerarrículo</p>
                <button id="botaoCadastro">Cadastrar</button>
            </div>
        </section>
    </main>
    <footer id="rodape">
        <div class="links-container">
            <a class="github-link" href="https://github.com/billafranca" target="_blank">
                <img src="images/github.png" alt="GitHub">Billafranca
            </a>
            <a class="github-link" href="https://github.com/lucas-rabello-dev" target="_blank">
                <img src="images/github.png" alt="GitHub">Lucas Rabello
            </a>
        </div>
        <center><p>&copy; 2025 Gerarrículo. Todos os direitos reservados.</p></center>
    </footer>

    <script src="js/page_entrada.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
